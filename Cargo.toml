[package]
name = "dragonoff"
version = "0.2.0"
edition = "2024"
rust-version = "1.87"
description = "Agent-controlled music composition and audio rendering engine"
license = "GPL-2.0-or-later"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
